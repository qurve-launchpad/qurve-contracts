version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # Pin Uniswap V3 versions — they have specific OZ compatibility requirements
      - dependency-name: "@uniswap/v3-core"
      - dependency-name: "@uniswap/v3-periphery"
    groups:
      openzeppelin:
        patterns:
          - "@openzeppelin/*"
      hardhat:
        patterns:
          - "hardhat*"
          - "@nomicfoundation/*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
